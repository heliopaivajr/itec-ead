<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea384c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea384c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Red glow circle -->
  <circle cx="900" cy="200" r="350" fill="url(#glow)"/>
  <circle cx="200" cy="500" r="250" fill="url(#glow)"/>

  <!-- Red accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="#ea384c" opacity="0.8"/>

  <!-- Logo circle -->
  <circle cx="140" cy="315" r="70" fill="none" stroke="#ea384c" stroke-width="2" opacity="0.5"/>
  <circle cx="140" cy="315" r="60" fill="#ffffff" opacity="0.05"/>
  <!-- Cross symbol -->
  <rect x="128" y="285" width="24" height="60" rx="4" fill="#ea384c" opacity="0.9"/>
  <rect x="110" y="303" width="60" height="24" rx="4" fill="#ea384c" opacity="0.9"/>

  <!-- ITEC EAD title -->
  <text x="240" y="290" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#ffffff" letter-spacing="-2">ITEC EAD</text>

  <!-- Subtitle -->
  <text x="240" y="340" font-family="Georgia, serif" font-size="28" fill="#ea384c" letter-spacing="2">Instituto de Teologia Cristã</text>

  <!-- Description -->
  <text x="240" y="395" font-family="Arial, sans-serif" font-size="22" fill="#999999">Formação teológica de excelência · 100% Online</text>

  <!-- Divider -->
  <rect x="240" y="420" width="120" height="2" fill="#ea384c" opacity="0.6"/>

  <!-- Tags -->
  <rect x="240" y="445" width="200" height="36" rx="18" fill="#ea384c" opacity="0.15" stroke="#ea384c" stroke-width="1" stroke-opacity="0.4"/>
  <text x="340" y="469" font-family="Arial, sans-serif" font-size="16" fill="#ea384c" text-anchor="middle">Graduação</text>

  <rect x="455" y="445" width="200" height="36" rx="18" fill="#ea384c" opacity="0.15" stroke="#ea384c" stroke-width="1" stroke-opacity="0.4"/>
  <text x="555" y="469" font-family="Arial, sans-serif" font-size="16" fill="#ea384c" text-anchor="middle">Cursos Livres</text>

  <rect x="670" y="445" width="200" height="36" rx="18" fill="#ea384c" opacity="0.15" stroke="#ea384c" stroke-width="1" stroke-opacity="0.4"/>
  <text x="770" y="469" font-family="Arial, sans-serif" font-size="16" fill="#ea384c" text-anchor="middle">Comunidade</text>

  <!-- URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="20" fill="#555555" text-anchor="middle">itec-ead.vercel.app</text>

  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="#ea384c" opacity="0.8"/>
</svg>
